version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docmind_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API & Web UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
    driver: local
